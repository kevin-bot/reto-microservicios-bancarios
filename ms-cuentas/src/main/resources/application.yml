server:
  port: 8082
  servlet:
    context-path: /api

spring:
  application:
    name: ms-cuentas
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cuentas_db}
    username: ${DB_USER:cuentas_user}
    password: ${DB_PASSWORD:cuentas_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    web:
      pageable:
        max-page-size: 100

banco:
  zona-horaria: America/Guayaquil

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
