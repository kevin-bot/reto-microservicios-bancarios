server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: ms-clientes
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clientes_db}
    username: ${DB_USER:clientes_user}
    password: ${DB_PASSWORD:clientes_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    web:
      pageable:
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
